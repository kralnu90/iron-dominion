<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iron Dominion</title>
<meta name="description" content="Iron Dominion: a grimdark sci-fi tabletop wargame for your phone. Command squads, roll the dice yourself and hold the objectives. Free, from Kralnu Games.">
<meta name="theme-color" content="#14110f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta property="og:title" content="Iron Dominion">
<meta property="og:description" content="A grimdark tabletop wargame for your phone. Roll the dice yourself and hold the line.">
<meta property="og:image" content="icons/icon-512.png">
<style>
:root{--gold:#d9b54a;--ink:#14110f;--panel:#221c18;--edge:#4a3a2c;--text:#efe6d6;--dim:#a8998a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(ellipse at 50% -10%,#3a2a20,#14110f 60%);color:var(--text);font:15px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;letter-spacing:.04em;margin:.2em 0}
button{font:inherit;color:inherit;cursor:pointer}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0c0a09;transition:opacity .6s}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:120px;filter:drop-shadow(0 0 20px rgba(217,181,74,.35))}
#splash h1{color:var(--gold);font-size:30px;text-transform:uppercase}
#splash p{color:var(--dim);font-size:12px;margin:0}
.menu{max-width:420px;margin:0 auto;padding:28px 18px;display:flex;flex-direction:column;gap:12px;text-align:center}
.menu h1{color:var(--gold);font-size:34px;text-transform:uppercase;text-shadow:0 2px 0 #000}
.menu .tag{color:var(--dim);margin:0 0 8px}
.crest img{width:110px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px;border-radius:14px;border:1px solid var(--edge);background:linear-gradient(160deg,#2c241e,#1b1613);box-shadow:0 4px 12px rgba(0,0,0,.4);font-weight:700}
.tile span{font-size:24px;color:var(--gold)}
.tile small{font-weight:400;color:var(--dim);font-size:12px}
.tile.big{padding:20px;font-size:18px;border-color:var(--gold);background:linear-gradient(160deg,#4a3818,#241a0e)}
.row,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ver{color:var(--dim);font-size:11px;margin-top:8px}
.b{border:1px solid var(--edge);background:#2c241e;border-radius:10px;padding:9px 14px;font-weight:700;display:inline-block;text-decoration:none;color:var(--text)}
.b.gold{background:linear-gradient(180deg,#e6c55e,#b38a2a);color:#1d1406;border-color:#f0d47a}
.b.big{padding:13px 22px;font-size:17px}
.b.end{background:#3a2a20;border-color:#7a5a3a}
.b.danger{background:#5a1c18;border-color:#8a3a30;margin-top:10px}
.dlg-btns .b.danger{margin-top:0}
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:14px}
.dlg{background:linear-gradient(170deg,#2a221c,#17120f);border:1px solid var(--gold);border-radius:16px;padding:16px;width:min(380px,100%);max-height:88vh;overflow:auto;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.dlg.wide{width:min(460px,100%);text-align:left}
.dlg h2{color:var(--gold);font-size:20px}
.dlg-b{color:var(--text);font-size:14px;margin:8px 0 12px;text-align:left}
.dlg-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.prose p,.prose li{font-size:14px}.prose ol{padding-left:20px}.center{text-align:center}
.small{color:var(--dim);font-size:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.b small{display:block;font-weight:400;font-size:11px;opacity:.8;margin-top:2px}
.b[disabled],.tile[disabled]{opacity:.4;pointer-events:none}
/* muster */
.mus{max-width:460px;margin:0 auto;padding:14px 14px 30px;display:flex;flex-direction:column;gap:10px}
.mus-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.mus-top h2{color:var(--gold);margin:0}.mus-top span{width:70px}
.mus .tag{color:var(--dim);font-size:13px;margin:0;text-align:center}
.lname{flex:1;min-width:0;background:#14110f;border:1px solid var(--edge);border-radius:10px;color:var(--gold);font:700 17px Georgia,serif;padding:8px 10px;text-align:center}
.lrow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--edge);border-left:5px solid var(--c);background:#221c18}
.lrow b{font-size:16px}.lrow span{color:var(--dim);font-size:12px}.lrow em{color:#ff9a7a;font-size:12px;font-style:normal}.lrow i{color:#7be08f;font-size:12px;font-style:normal}
.lhead{background:#221c18;border:1px solid var(--edge);border-top:4px solid var(--c);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.lhead>b{color:var(--c);font-family:Georgia,serif;font-size:16px}
.chip{align-self:flex-start;border:1px solid var(--c);background:transparent;color:var(--text);border-radius:20px;padding:4px 12px;font-weight:700;font-size:13px}
.sub-txt{font-size:12px;color:#e8d9a8}
.bar{height:10px;background:#14110f;border-radius:6px;overflow:hidden}.bar div{height:100%;transition:width .3s}
.bar-l{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.probs{color:#ff9a7a;font-size:12px}.okay{color:#7be08f;font-size:12px;font-weight:700}
.urows{display:flex;flex-direction:column;gap:6px}
.urow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--edge);background:#1d1714;text-align:left}
.urow.led{margin-left:22px;border-color:var(--gold);background:#241d14}
.urow .ic{font-size:22px;width:28px;text-align:center;color:var(--gold)}.urow .nm{flex:1;display:flex;flex-direction:column}.urow small{color:var(--dim);font-size:12px}.urow .pt{font-weight:800;color:var(--gold)}
.empty{color:var(--dim);text-align:center;font-size:13px;padding:14px}
.dlist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.ds{background:#1d1714;border:1px solid var(--edge);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.ds-h{display:flex;align-items:center;gap:8px}.ds-h .ic{font-size:20px;color:var(--gold)}.ds-h b{flex:1}.ds-h .pt{color:var(--gold);font-weight:700;font-size:13px}
.ds .rl{color:#e8d9a8}.ds .b{align-self:flex-end}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.seg .b{padding:6px 10px;font-size:13px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
.set select,.set input[type=range]{flex:0 0 55%}
select,input,textarea{background:#1a1512;color:var(--text);border:1px solid var(--edge);border-radius:8px;padding:7px;font:inherit;width:100%}
textarea{min-height:64px;margin:6px 0}
/* battle */
body.in-battle{overflow-x:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 8px}
.topbar button{width:38px;height:34px;border-radius:9px;border:1px solid var(--edge);background:#2c241e}
.topbar span{font-family:Georgia,serif;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-size:13px}
#bf{max-width:520px;margin:0 auto;padding:0 4px 12px}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-bottom:6px}
.hud .side{border-left:4px solid var(--c);background:#221c18;border-radius:8px;padding:4px 8px;display:flex;flex-direction:column;font-size:12px}
.hud .side.s1{border-left:0;border-right:4px solid var(--c);text-align:right}
.hud .side span{color:var(--dim)}
.hud .rnd{text-align:center;display:flex;flex-direction:column;font-size:12px}.hud .rnd b{color:var(--gold)}
.board-wrap{display:flex;justify-content:center}
.board{position:relative;background-color:#3b3a33;background-image:linear-gradient(rgba(0,0,0,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.18) 1px,transparent 1px);border:3px solid #5a4632;border-radius:6px;box-shadow:inset 0 0 40px rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.6);overflow:hidden;touch-action:manipulation}
.board::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(208,112,44,.08) 0,transparent 20%,transparent 80%,rgba(43,74,122,.12) 100%);pointer-events:none}
.t-ruin{position:absolute;background:linear-gradient(135deg,#6e6457,#4b443b);border:1px solid #2d2822;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.t-crater{position:absolute;background:radial-gradient(circle,#2a2622 30%,#4a453d 70%,transparent 72%)}
.t-wall{position:absolute;background:repeating-linear-gradient(45deg,#7a6a4a 0 4px,#5a4c33 4px 8px);border-radius:3px;transform:scaleY(.5)}
.reach{position:absolute;background:rgba(120,220,140,.28);outline:1px solid rgba(120,220,140,.35)}
.obj{position:absolute;border:2px dashed;border-radius:50%;pointer-events:none;display:flex;align-items:center;justify-content:center}
.obj span{width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:800;color:#111;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.mdl{position:absolute;border-radius:50%;border:2px solid rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#111;font-weight:800;line-height:1;box-shadow:0 2px 4px rgba(0,0,0,.6);transition:left .35s ease,top .35s ease}
.mdl.veh{border-radius:22%}
.mdl.ldr{border-color:var(--gold);border-width:3px}
.rule.sub-line{color:var(--dim)}
.mdl.sel{box-shadow:0 0 0 3px #fff,0 0 12px #fff}
.mdl.view{box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.mdl.tgt{box-shadow:0 0 0 3px #ff5a4a,0 0 12px #ff5a4a;animation:pulse 1s infinite}
.mdl.aim{box-shadow:0 0 0 3px #ff3b2f,0 0 16px #ff3b2f}
.mdl.fl{box-shadow:0 0 0 3px #ffe58a}
.mdl.shk{filter:saturate(.3) brightness(.8)}
.mdl .wd{position:absolute;right:-5px;top:-5px;background:#c0261c;color:#fff;font-style:normal;font-size:9px;border-radius:7px;padding:0 3px}
@keyframes pulse{50%{box-shadow:0 0 0 3px #ff5a4a,0 0 2px #ff5a4a}}
.banner{position:absolute;left:0;right:0;top:40%;text-align:center;pointer-events:none;opacity:0}
.banner b{display:block;font-family:Georgia,serif;color:var(--gold);font-size:20px;text-shadow:0 2px 6px #000}
.banner span{color:#fff;text-shadow:0 2px 6px #000;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.banner.show{animation:ban 1.6s ease}
@keyframes ban{0%{opacity:0;transform:translateY(8px)}15%,70%{opacity:1;transform:none}100%{opacity:0}}
.panel{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.msg{text-align:center;color:var(--dim);font-size:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.card{background:#221c18;border:1px solid var(--edge);border-radius:12px;padding:8px 10px;font-size:12px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}.card-h b{font-size:14px}.card-h span{color:var(--dim)}
.stats{display:flex;gap:4px;margin:4px 0 6px}.stats div{flex:1;background:#14110f;border-radius:6px;text-align:center;padding:2px 0}.stats i{display:block;font-style:normal;font-size:9px;color:var(--dim)}.stats b{font-size:13px}
.wl{margin:2px 0}.wl span{color:var(--dim)}
.rule{margin-top:4px;color:#e8d9a8}
.flags{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}.flags span{background:#3a2a20;border-radius:6px;padding:1px 6px;font-size:11px}
/* dice tray */
#tray{position:fixed;left:0;right:0;bottom:0;z-index:50;transform:translateY(110%);transition:transform .3s ease;display:flex;justify-content:center;padding:0 6px calc(8px + env(safe-area-inset-bottom))}
#tray.on{transform:none}
.tray-in{width:min(520px,100%);background:radial-gradient(ellipse at 50% 0,#3d2a1c,#1a120c 80%);border:2px solid #7a5a3a;border-bottom:0;border-radius:18px 18px 0 0;padding:12px 12px 14px;box-shadow:0 -10px 30px rgba(0,0,0,.6);text-align:center}
.tray-title{font-family:Georgia,serif;color:var(--gold);font-size:15px}
.tray-label{color:var(--text);font-size:13px;margin:2px 0 8px}
.dice{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;min-height:44px;padding:10px;background:rgba(0,0,0,.35);border-radius:12px;box-shadow:inset 0 2px 10px rgba(0,0,0,.6)}
.die{width:36px;height:36px;border-radius:8px;background:linear-gradient(160deg,#fbf6ea,#d9cdb3);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:5px;box-shadow:0 3px 0 #8f7a4f,0 4px 6px rgba(0,0,0,.5);transition:transform .2s,opacity .2s}
.die span.pip{width:7px;height:7px;border-radius:50%;background:#2a1a10;place-self:center}
.die.good{background:linear-gradient(160deg,#fbf6ea,#d9cdb3);box-shadow:0 0 0 2px #5fd07a,0 3px 0 #8f7a4f}
.die.bad{opacity:.45;filter:grayscale(.6)}
.die.blank{background:linear-gradient(160deg,#cfc6b3,#a89c84)}
.dice.rolling .die{animation:tumble .12s infinite alternate}
.dice.picking .die{animation:wob .6s infinite;cursor:pointer}
@keyframes tumble{from{transform:rotate(-14deg) translateY(-3px)}to{transform:rotate(16deg) translateY(2px)}}
@keyframes wob{50%{transform:rotate(6deg) scale(1.06)}}
.tray-sum{margin-top:8px;font-weight:800;font-size:15px}.tray-sum.good{color:#7be08f}.tray-sum.bad{color:#ff8a7a}
.tray-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-150%);transition:transform .3s;z-index:70;background:#2c241e;border:1px solid var(--gold);border-radius:12px;padding:8px 14px;font-weight:700;font-size:13px;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="splash"><img src="icons/icon-512.png" alt=""><h1>Iron Dominion</h1><p>Kralnu Games presents · built with Claude, an AI by Anthropic</p></div>
<div id="app"></div>
<script>

/* ============================================================================
   IRON DOMINION: armies, weapons, battlefield (all original names and numbers)
   Distances are in inches; the board is a grid of 2" squares.
   ============================================================================ */
const GAME_VERSION = '0.2.0';
const COLS = 15, ROWS = 21, SQ = 2;   // 30" x 42" skirmish board

/* Weapon keywords: rapid N (+N attacks at half range), torrent (auto-hits), heavy (+1 to hit if stationary),
   twin (re-roll wounds), melta N (+N damage at half range), assault (may fire after advancing), pistol */
const WEAPONS = {
  arcPistol:   { n: 'Arc pistol', r: 12, A: 1, sk: 2, S: 5, AP: -1, D: 2, kw: { pistol: 1 } },
  powerSword:  { n: 'Power sword', r: 0, A: 5, sk: 2, S: 5, AP: -2, D: 1, kw: {} },
  arcCarbine:  { n: 'Arc carbine', r: 24, A: 2, sk: 3, S: 4, AP: -1, D: 1, kw: { rapid: 1 } },
  fusionGun:   { n: 'Fusion gun', r: 12, A: 1, sk: 3, S: 9, AP: -4, D: 'D6', kw: { melta: 2, assault: 1 } },
  combatBlade: { n: 'Combat blade', r: 0, A: 3, sk: 3, S: 4, AP: 0, D: 1, kw: {} },
  powerMaul:   { n: 'Power maul', r: 0, A: 3, sk: 3, S: 6, AP: -1, D: 1, kw: {} },
  scatterPistol: { n: 'Scatter pistol', r: 12, A: 1, sk: 3, S: 4, AP: 0, D: 1, kw: { pistol: 1, assault: 1 } },
  chainblade:  { n: 'Chainblade', r: 0, A: 4, sk: 3, S: 4, AP: -1, D: 1, kw: {} },
  twinCarbine: { n: 'Twin arc carbine', r: 24, A: 2, sk: 3, S: 4, AP: -1, D: 1, kw: { rapid: 1, twin: 1, assault: 1 } },
  riderBlade:  { n: 'Lance blade', r: 0, A: 3, sk: 3, S: 5, AP: -1, D: 1, kw: {} },
  assaultCannon: { n: 'Assault cannon', r: 24, A: 6, sk: 3, S: 6, AP: 0, D: 1, kw: {} },
  powerFist:   { n: 'Siege fist', r: 0, A: 4, sk: 3, S: 12, AP: -2, D: 3, kw: {} },
  rivetGun:    { n: 'Rivet gun', r: 18, A: 3, sk: 5, S: 6, AP: -1, D: 1, kw: {} },
  bigCleaver:  { n: 'Gut cleaver', r: 0, A: 5, sk: 2, S: 8, AP: -2, D: 2, kw: {} },
  scrapPistol: { n: 'Scrap pistol', r: 12, A: 1, sk: 5, S: 4, AP: 0, D: 1, kw: { pistol: 1, assault: 1 } },
  hacker:      { n: 'Hacker', r: 0, A: 3, sk: 3, S: 4, AP: 0, D: 1, kw: {} },
  smasher:     { n: 'Smasher', r: 0, A: 3, sk: 3, S: 6, AP: -1, D: 2, kw: {} },
  smogThrower: { n: 'Smog thrower', r: 12, A: 'D6', sk: 0, S: 4, AP: 0, D: 1, kw: { torrent: 1, assault: 1 } },
  twinRivets:  { n: 'Twin rivet guns', r: 18, A: 3, sk: 5, S: 6, AP: -1, D: 1, kw: { twin: 1, assault: 1 } },
  riderHook:   { n: 'Ripper hooks', r: 0, A: 3, sk: 3, S: 5, AP: -1, D: 1, kw: {} },
  roarCannon:  { n: 'Roar cannon', r: 36, A: 4, sk: 5, S: 7, AP: -1, D: 2, kw: { heavy: 1 } },
  crusher:     { n: 'Crusher claws', r: 0, A: 4, sk: 4, S: 12, AP: -2, D: 3, kw: {} },
  /* Stage 2 wargear */
  masterCarbine: { n: 'Master-forged carbine', r: 24, A: 2, sk: 2, S: 4, AP: -1, D: 2, kw: { rapid: 1 } },
  stormHammer: { n: 'Storm hammer', r: 0, A: 4, sk: 3, S: 8, AP: -2, D: 2, kw: {} },
  sunRifle:    { n: 'Sun rifle', r: 24, A: 2, sk: 3, S: 7, AP: -2, D: 1, kw: { rapid: 1 } },
  arcCannon:   { n: 'Arc cannon', r: 36, A: 3, sk: 3, S: 8, AP: -1, D: 2, kw: { heavy: 1 } },
  fusionLance: { n: 'Fusion lance', r: 12, A: 1, sk: 3, S: 9, AP: -4, D: 'D6', kw: { melta: 2, twin: 1, assault: 1 } },
  lanceCannon: { n: 'Lance cannon', r: 36, A: 2, sk: 3, S: 10, AP: -3, D: 'D6+1', kw: { heavy: 1 } },
  oathMaul:    { n: 'Oath maul', r: 0, A: 5, sk: 2, S: 6, AP: -1, D: 2, kw: {} },
  wreckerClaw: { n: 'Wrecker claw', r: 0, A: 4, sk: 3, S: 10, AP: -2, D: 2, kw: {} },
  spikeLauncher: { n: 'Spike launcher', r: 24, A: 1, sk: 5, S: 9, AP: -2, D: 'D3', kw: {} },
  flameBelcher: { n: 'Flame belcher', r: 12, A: '2D6', sk: 0, S: 5, AP: -1, D: 1, kw: { torrent: 1 } },
  sparkWelder: { n: 'Spark welder', r: 12, A: 'D6', sk: 0, S: 5, AP: -1, D: 1, kw: { torrent: 1, pistol: 1 } },
  bigWrench:   { n: 'Big wrench', r: 0, A: 3, sk: 3, S: 7, AP: -1, D: 2, kw: {} }
};

/* Each unit lists its models: [count, guns, melee]. Plain models die first, specialists last.
   sizes: squad sizes and their points (extra models join the first group).
   opts: free wargear swaps; choice 0 is the starting loadout. g = model group, f = guns or melee.
   Leaders can join one of the units in "leads"; their "lead" ability then applies to that unit. */
const UNITS = {
  /* ---------------- THE IRONCLAD COVENANT ---------------- */
  knightCaptain: { n: 'Knight-Captain', role: 'Leader', pts: 60, ic: '♛', M: 6, T: 4, Sv: 3, W: 5, Ld: 6, OC: 1, ward: 4,
    models: [[1, ['arcPistol'], ['powerSword']]], rule: { id: 'rerollOnes', n: 'Lead from the Front', txt: 'Friendly units within 6" may re-roll hit rolls of 1.' },
    lead: { id: 'ocBoost', n: 'Hold This Ground', txt: 'Every model in the unit gets +1 OC.' }, leads: ['shieldbrothers', 'breachers'],
    opts: [{ id: 'gun', n: 'Ranged weapon', g: 0, f: 'guns', ch: [['arcPistol'], ['masterCarbine']] }, { id: 'mel', n: 'Melee weapon', g: 0, f: 'melee', ch: [['powerSword'], ['stormHammer']] }] },
  oathkeeper: { n: 'Oathkeeper', role: 'Leader', pts: 55, ic: '✠', M: 6, T: 4, Sv: 3, W: 4, Ld: 6, OC: 1, ward: 4,
    models: [[1, ['arcPistol'], ['oathMaul']]],
    lead: { id: 'meleeWound', n: 'Litany of Wrath', txt: 'The unit adds 1 to wound rolls in melee.' }, leads: ['shieldbrothers', 'breachers'] },

/* Battlefield: rotationally symmetric so both sides get the same ground. */
const OBJECTIVES = [[7, 10], [7, 3], [7, 17], [2, 10], [12, 10]];
const TERRAIN = (() => {
  const t = {};
  const add = (type, cells) => cells.forEach(([c, r]) => { t[c + ',' + r] = type; t[(COLS - 1 - c) + ',' + (ROWS - 1 - r)] = type; });
  add('ruin', [[3, 7], [4, 7], [3, 8], [9, 5], [10, 5], [10, 6], [0, 12], [1, 12]]);
  add('crater', [[6, 9], [5, 11]]);
  add('wall', [[7, 7], [12, 13], [13, 13], [2, 4], [3, 4]]);
  return t;
})();
const TERRAIN_INFO = { ruin: { n: 'Ruins', cover: 1, blocks: 1 }, crater: { n: 'Crater', cover: 1, blocks: 0 }, wall: { n: 'Barricade', cover: 1, blocks: 0 } };
/* ============================================================================
   IRON DOMINION: Muster. Army lists (points, squad sizes, wargear, leaders),
   saved lists, random forces for the AI, and the army builder screens.
   A list entry is { k: key, d: datasheet id, s: size index, o: { optionId: choice }, at: key of the unit a leader joins }
   ============================================================================ */
const newKey = () => Math.random().toString(36).slice(2, 9);
const entryPts = e => UNITS[e.d].sizes[e.s || 0].pts;
const entryModels = e => UNITS[e.d].sizes[e.s || 0].n;
const listPts = L => L.units.reduce((a, e) => a + entryPts(e), 0);
const listModels = L => L.units.reduce((a, e) => a + entryModels(e), 0);
const armyOf = d => Object.keys(ARMIES).find(a => ARMIES[a].roster.includes(d));
const maxOf = d => UNITS[d].role === 'Core troops' ? 6 : UNITS[d].role === 'Leader' ? 2 : 3;
const sizeCfg = pts => POINTS.find(p => p.pts === pts) || POINTS[0];

/* the models an entry fields: [[count, guns, melee], ...] after size and wargear */
function buildModels(e) {
  const U = UNITS[e.d];
  const groups = U.models.map(([n, g, m]) => [n, g.slice(), m.slice()]);
  for (const o of U.opts) if (o.x2 && e.s) groups[o.g][0] *= 2; // big squads get two special weapons
  groups[0][0] += entryModels(e) - groups.reduce((a, g) => a + g[0], 0);
  for (const o of U.opts) { const c = (e.o || {})[o.id] || 0; groups[o.g][o.f === 'guns' ? 1 : 2] = o.ch[c].slice(); }
  return groups;
}
function starterList(army) {
  const A = ARMIES[army], units = A.list.map(d => ({ k: newKey(), d, s: 0, o: {} }));
  if (A.leadsInto != null) units[0].at = units[A.leadsInto].k;
  return { id: 'starter-' + army, name: 'Starter force', army, sub: A.sub, pts: 500, units, builtIn: true };
}
/* problems that stop a list from being taken to battle */
function listProblems(L) {
  const P = [], pts = listPts(L), cfg = sizeCfg(L.pts), cnt = {};
  if (!L.units.length) return ['Add some units'];
  if (pts > L.pts) P.push(`${pts - L.pts} points over the ${L.pts} limit`);
  if (!L.units.some(e => UNITS[e.d].role === 'Leader')) P.push('Needs at least one Leader to command it');
  L.units.forEach(e => cnt[e.d] = (cnt[e.d] || 0) + 1);
  for (const [d, n] of Object.entries(cnt)) if (n > maxOf(d)) P.push(`Too many ${UNITS[d].n} (max ${maxOf(d)})`);
  const m = listModels(L); if (m > cfg.maxModels) P.push(`${m} models won't fit the deployment zone (max ${cfg.maxModels})`);
  return P;
}
/* units a leader could join: the right datasheet, not already led */
function bodyguards(L, le) {
  return L.units.filter(e => UNITS[le.d].leads && UNITS[le.d].leads.includes(e.d) && !L.units.some(x => x !== le && x.at === e.k));
}
function tidyList(L) { const ks = new Set(L.units.map(e => e.k)); for (const e of L.units) if (e.at && (!ks.has(e.at) || !bodyguards(L, e).some(b => b.k === e.at))) delete e.at; }

/* a random, legal force: used for the AI general and the "Random force" option */
function randomList(army, pts) {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const L = { id: 'random', name: 'Random force', army, sub: pick(Object.keys(SUBS[army])), pts, units: [] };
  const roster = ARMIES[army].roster, cfg = sizeCfg(pts);
  const fits = (d, s) => { const e = { d, s }; return listPts(L) + entryPts(e) <= pts && listModels(L) + entryModels(e) <= cfg.maxModels && L.units.filter(x => x.d === d).length < maxOf(d); };
  const add = (d, s) => { const o = {}; UNITS[d].opts.forEach(op => o[op.id] = Math.random() < .5 ? 0 : Math.floor(Math.random() * op.ch.length)); L.units.push({ k: newKey(), d, s, o }); };
  add(pick(roster.filter(d => UNITS[d].role === 'Leader')), 0);
  const core = roster.find(d => UNITS[d].role === 'Core troops'); add(core, Math.random() < .3 && pts > 500 ? 1 : 0);
  for (let guard = 0; guard < 40; guard++) {
    const opts = [];
    for (const d of roster) UNITS[d].sizes.forEach((_, s) => { if (!fits(d, s)) return; const w = UNITS[d].role === 'Leader' ? .5 : UNITS[d].role === 'Core troops' ? 2.5 : 2; opts.push([d, s, s ? w * .5 : w]); });
    if (!opts.length) break;
    let r = Math.random() * opts.reduce((a, x) => a + x[2], 0); const ch = opts.find(x => (r -= x[2]) <= 0) || opts[0];
    add(ch[0], ch[1]);
  }
  for (const le of L.units.filter(e => UNITS[e.d].role === 'Leader')) { const bg = bodyguards(L, le); if (bg.length && Math.random() < .8) le.at = pick(bg).k; }
  return L;
}

/* ---------- saved lists and the builder screens ---------- */
const Muster = {
  cur: null,
  all() { return Store.get('lists', []); },
  put(ls) { Store.set('lists', ls); },
  get(id) { return this.all().find(L => L.id === id); },
  L() { return this.get(this.cur); },
  commit(L) { tidyList(L); const ls = this.all(), i = ls.findIndex(x => x.id === L.id); if (i >= 0) ls[i] = L; else ls.push(L); this.put(ls); this.draw(); },
  col(army) { return ARMIES[army].col; },
  /* the list of saved armies */
  home() {
    this.cur = null;
    const ls = this.all();
    Shell.screen(`<div class="mus">
      <div class="mus-top"><button class="b" onclick="Shell.menu()">← Back</button><h2>Muster</h2><span></span></div>
      <p class="tag">Build your armies: pick units, squad sizes and wargear, and attach your leaders. Lists save on your phone.</p>
      ${ls.length ? ls.map(L => { const P = listProblems(L); return `<button class="lrow" onclick="Muster.edit('${L.id}')" style="--c:${this.col(L.army)}"><b>${esc(L.name)}</b><span>${ARMIES[L.army].short} · ${SUBS[L.army][L.sub].n} · ${listPts(L)}/${L.pts} pts</span>${P.length ? `<em>⚠ ${P[0]}</em>` : `<i>Ready for battle</i>`}</button>`; }).join('') : `<div class="empty">No army lists yet. The starter forces are always there when you play.</div>`}
      <button class="tile big" onclick="Muster.create()"><span>＋</span>New army list</button></div>`);
  },
  async create() {
    const army = await choose('Which army?', Object.values(ARMIES).map(a => `<b style="color:${a.col}">${a.n}</b>: ${a.blurb}`).join('<br><br>'), Object.entries(ARMIES).map(([k, a]) => ({ l: a.short, v: k })).concat([{ l: 'Back', v: null }]));
    if (!army) return;
    const pts = await choose('Battle size', 'How many points can this army spend?', POINTS.map(p => ({ l: `${p.pts} pts · ${p.n}`, v: p.pts })).concat([{ l: 'Back', v: null }]));
    if (!pts) return;
    const sub = await this.pickSub(army); if (!sub) return;
    const start = await choose('Start from', '', [{ l: 'An empty list', v: 'empty', p: 1 }, { l: 'The starter force', v: 'starter' }]);
    const L = { id: newKey(), name: `${ARMIES[army].short} ${pts}`, army, sub, pts, units: [] };
    if (start === 'starter') L.units = starterList(army).units;
    this.cur = L.id; this.commit(L);
  },
  pickSub(army) {
    return choose('Choose a sub-faction', 'Its rule applies to your whole army.', Object.entries(SUBS[army]).map(([k, x]) => ({ l: `<b>${x.n}</b><small>${x.tag}. ${x.rn}: ${x.txt}</small>`, v: k })).concat([{ l: 'Back', v: null }]));
  },
  edit(id) { this.cur = id; this.draw(); },
  /* the list editor */
  draw() {
    const L = this.L(); if (!L) return this.home();
    const pts = listPts(L), P = listProblems(L), sub = SUBS[L.army][L.sub], pct = Math.min(100, pts / L.pts * 100);
    const leadOf = e => L.units.find(x => x.at === e.k), rows = [];
    for (const e of L.units) {
      if (e.at && L.units.some(x => x.k === e.at)) continue; // leaders show under their unit
      const U = UNITS[e.d], le = leadOf(e);
      rows.push(`<button class="urow" onclick="Muster.unit('${e.k}')"><span class="ic">${U.ic}</span><span class="nm"><b>${U.n}${U.sizes.length > 1 || entryModels(e) > 1 ? ` ×${entryModels(e)}` : ''}</b><small>${this.gearText(e) || U.role}</small></span><span class="pt">${entryPts(e)}</span></button>`);
      if (le) rows.push(`<button class="urow led" onclick="Muster.unit('${le.k}')"><span class="ic">${UNITS[le.d].ic}</span><span class="nm"><b>${UNITS[le.d].n}</b><small>Leading the ${U.n}${this.gearText(le) ? ' · ' + this.gearText(le) : ''}</small></span><span class="pt">${entryPts(le)}</span></button>`);
    }
    Shell.screen(`<div class="mus">
      <div class="mus-top"><button class="b" onclick="Muster.home()">← Lists</button><input class="lname" value="${esc(L.name)}" maxlength="28" onchange="Muster.rename(this.value)" aria-label="List name"><button class="b" onclick="Muster.more()">⋯</button></div>
      <div class="lhead" style="--c:${this.col(L.army)}"><b>${ARMIES[L.army].n}</b><button class="chip" onclick="Muster.changeSub()">${sub.n} ▾</button>
        <div class="sub-txt"><b>${sub.rn}:</b> ${sub.txt}</div>
        <div class="bar"><div style="width:${pct}%;background:${pts > L.pts ? '#c0261c' : 'var(--c)'}"></div></div>
        <div class="bar-l"><span>${pts} / ${L.pts} pts</span><span>${listModels(L)} models</span></div>
        ${P.length ? `<div class="probs">${P.map(x => `<div>⚠ ${x}</div>`).join('')}</div>` : `<div class="okay">✔ Ready for battle</div>`}</div>
      <div class="urows">${rows.join('') || '<div class="empty">No units yet.</div>'}</div>
      <button class="tile" onclick="Muster.addSheet()"><span>＋</span>Add unit</button>
      <button class="tile big" ${P.length ? 'disabled' : ''} onclick="Muster.battle()"><span>⚔</span>Battle with this list</button></div>`);
  },
  gearText(e) {
    const U = UNITS[e.d], out = [];
    for (const o of U.opts) { const c = (e.o || {})[o.id] || 0; if (c) out.push(o.ch[c].map(w => WEAPONS[w].n).join(' + ')); }
    return out.join(', ');
  },
  rename(v) { const L = this.L(); L.name = v.trim().slice(0, 28) || 'My army'; this.commit(L); },
  async changeSub() { const L = this.L(), s = await this.pickSub(L.army); if (s) { L.sub = s; this.commit(L); } },
  async more() {
    const L = this.L();
    const v = await choose(esc(L.name), '', [{ l: '⧉ Duplicate list', v: 'dup' }, { l: '⇄ Change battle size', v: 'size' }, { l: '🗑 Delete list', v: 'del' }, { l: 'Back', v: null, p: 1 }]);
    if (v === 'dup') { const c = JSON.parse(JSON.stringify(L)); c.id = newKey(); c.name = (L.name + ' copy').slice(0, 28); this.cur = c.id; this.commit(c); toast('List copied'); }
    else if (v === 'size') { const p = await choose('Battle size', '', POINTS.map(p => ({ l: `${p.pts} pts · ${p.n}`, v: p.pts, p: p.pts === L.pts }))); if (p) { L.pts = p; this.commit(L); } }
    else if (v === 'del') { const ok = await choose('Delete this list?', `"${esc(L.name)}" will be gone for good.`, [{ l: 'Delete', v: 1 }, { l: 'Keep', v: 0, p: 1 }]); if (ok) { this.put(this.all().filter(x => x.id !== L.id)); this.home(); } }
  },
  statLine(U) { return `M${U.M}" T${U.T} Sv${U.Sv}+ W${U.W} Ld${U.Ld}+ OC${U.OC}${U.ward ? ` · ward ${U.ward}+` : ''}`; },
  addSheet() {
    const L = this.L(), left = L.pts - listPts(L);
    sheet(`<h2>Add a unit</h2><p class="small">${left} points left.</p><div class="dlist">${ARMIES[L.army].roster.map(d => {
      const U = UNITS[d], n = L.units.filter(e => e.d === d).length, full = n >= maxOf(d), cheap = U.sizes[0].pts <= left;
      return `<div class="ds"><div class="ds-h"><span class="ic">${U.ic}</span><b>${U.n}</b><span class="pt">${U.sizes.map(s => s.pts).join(' / ')} pts</span></div>
        <div class="small">${U.role} · ${U.sizes.map(s => s.n).join(' or ')} model${U.sizes[0].n > 1 ? 's' : ''} · ${this.statLine(U)}</div>
        ${U.rule ? `<div class="small rl">${U.rule.n}: ${U.rule.txt}</div>` : ''}${U.lead ? `<div class="small rl">Leading: ${U.lead.n}: ${U.lead.txt} Joins ${U.leads.map(x => UNITS[x].n).join(' or ')}.</div>` : ''}
        <button class="b ${cheap && !full ? 'gold' : ''}" ${full ? 'disabled' : ''} onclick="Muster.add('${d}')">${full ? `Max ${maxOf(d)}` : cheap ? '＋ Add' : '＋ Add (over points)'}</button></div>`;
    }).join('')}</div>`);
  },
  add(d) { const L = this.L(), e = { k: newKey(), d, s: 0, o: {} }; L.units.push(e); if (UNITS[d].lead) { const bg = bodyguards(L, e); if (bg.length) e.at = bg[0].k; } closeSheet(); this.commit(L); toast(`${UNITS[d].n} added`); },
  unit(k) {
    const L = this.L(), e = L.units.find(x => x.k === k); if (!e) return;
    const U = UNITS[e.d], ws = {};

    log(`${UD(def).n} falls. ${UNITS[def.lead].n} fights on alone.`);
    def.def = def.lead; def.lead = null; def.startN = ms.length; ms.forEach(x => { x.ldr = false; x.spec = false; });
  }
}
function checkWipe() {
  if (G.over) return;
  const a = unitsOf(0).length, b = unitsOf(1).length;
  if (!a || !b) G.over = { winner: !a && !b ? -1 : a ? 0 : 1, why: 'wipe' };
}

/* ---------- moving ---------- */
function reachable(u, mode, adv = 0) {
  const a = u.models[0], range = (unitM(u) + adv) / SQ, occ = occMap(), out = new Set();
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
    if (Math.hypot(c - a.x, r - a.y) > range + .01) continue;
    const h = occ[key(c, r)]; if (h && h.u !== u) continue;
    if (adjEnemy(c, r, u.side, occ)) continue;
    out.add(key(c, r));
  }
  return out;
}
function moveUnit(u, c, r) {
  const save = u.models.map(m => [m.x, m.y]);
  const ok = formation(u, { x: c, y: r }, (x, y, occ) => !adjEnemy(x, y, u.side, occ));
  if (!ok) { u.models.forEach((m, i) => { m.x = save[i][0]; m.y = save[i][1]; }); return false; }
  return true;
}
function chargeMove(u, v, roll) {
  const occ = occMap(); for (const m of u.models) delete occ[key(m.x, m.y)];
  const reach = roll / SQ + .5;
  // best spot next to the target that the leading model can reach
  let best = null;
  for (const t of v.models) for (let dc = -1; dc <= 1; dc++) for (let dr = -1; dr <= 1; dr++) {
    const c = t.x + dc, r = t.y + dr; if (!inBoard(c, r) || occ[key(c, r)]) continue;
    const d = Math.min(...u.models.map(m => Math.hypot(m.x - c, m.y - r)));
    if (d <= reach && (!best || d < best.d)) best = { x: c, y: r, d };
  }
  if (!best) return false;
  return formation(u, best, (x, y, o) => { for (let dc = -1; dc <= 1; dc++) for (let dr = -1; dr <= 1; dr++) { const h = o[key(x + dc, y + dr)]; if (h && h.u.side !== u.side && h.u !== v) return false; } return true; });
}

/* ---------- the AI general ---------- */
const AI = {
  noise() { return G.cfg.diff === 'easy' ? Math.random() * 6 : G.cfg.diff === 'hard' ? 0 : Math.random() * 1.5; },
  isMelee(u) { const fake = { models: [{ x: 0, y: 0 }] }; let m = 0, r = 0; for (const g of meleeGroups(u)) { const w = WP(g.wid); m += avgExpr(w.A) * g.models * w.S * avgExpr(w.D); } for (const md of u.models) for (const wid of md.guns) { const w = WP(wid); r += avgExpr(w.A) * w.S * avgExpr(w.D) * (w.kw.torrent ? 1.5 : 1); } return m > r * 1.3; },
  maxRange(u) { let r = 0; for (const m of u.models) for (const wid of m.guns) r = Math.max(r, WP(wid).r); return r; },
  cellScore(u, c, r, side) {
    const ctl = objControl(), melee = AI.isMelee(u), oc = unitOC(u);
    let s = 0;
    OBJECTIVES.forEach(([oc0, or0], i) => {
      const d = Math.hypot(c - oc0, r - or0);
      const want = ctl[i] === side ? 3 : ctl[i] === -1 ? 9 : 11;
      if (d <= 1.6) s += want + Math.min(6, oc * .5); else s -= d * (melee ? .15 : .35) * (want / 9);
    });
    const enemies = unitsOf(enemyOf(side)); let nearest = 1e9;
    for (const v of enemies) for (const m of v.models) nearest = Math.min(nearest, Math.hypot(m.x - c, m.y - r) * SQ);
    if (melee) s -= nearest * .35;
    else { const R = AI.maxRange(u); if (nearest <= R) s += 4; else s -= (nearest - R) * .25; if (nearest < 6 && !UD(u).vehicle) s -= 3; }
    if (TERRAIN[key(c, r)] && TERRAIN[key(c, r)] !== 'ruin') s += 1.5; else if (TERRAIN[key(c, r)] === 'ruin') s += 2;
    return s;
  },
  bestMove(u, adv) {
    const R = reachable(u, 'move', adv); let best = null;
    for (const k of R) { const [c, r] = k.split(',').map(Number); const s = AI.cellScore(u, c, r, u.side) + AI.noise(); if (!best || s > best.s) best = { c, r, s }; }
    return best;
  },
  pickShot(u) {
    let best = null;
    for (const v of shootTargets(u)) {
      let s = expected(u, v, false); const left = v.models.reduce((a, m) => a + m.w, 0), val = v.pts / v.wStart;
      s *= val; if (s * 1.2 >= left * val) s += 3;
      if (objControl().some((x, i) => x !== u.side && v.models.some(m => Math.hypot(m.x - OBJECTIVES[i][0], m.y - OBJECTIVES[i][1]) <= 1.6))) s *= 1.4;
      s += AI.noise() * .3;
      if (!best || s > best.s) best = { v, s };
    }
    return best && best.s > .05 ? best.v : null;
  },
  chargeOdds(need, bonus, reroll) { let p = 0; for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) if (a + b + bonus >= need) p++; p /= 36; return reroll ? 1 - (1 - p) * (1 - p) : p; },
  pickCharge(u) {
    let best = null;
    for (const v of chargeTargets(u)) {
      const p = AI.chargeOdds(chargeNeed(u, v), chargeBonus(u), hasRule(u, 'rerollCharge') || leadIs(u, 'chargeRR'));
      const gain = expected(u, v, true) - expected(v, u, true) * .5;
      const s = p * gain + (AI.isMelee(u) ? 1.5 : -1) + AI.noise() * .2;
      if (p > .25 && (!best || s > best.s)) best = { v, s };
    }
    return best && best.s > .8 ? best.v : null;
  },
  pickFight(u) { let best = null; for (const v of engagedWith(u)) { const s = expected(u, v, true); if (!best || s > best.s) best = { v, s }; } return best ? best.v : null; }
};

/* ============================================================================
   IRON DOMINION: the dice tray, the battlefield view and the turn flow
   ============================================================================ */
const sleep = ms => new Promise(r => setTimeout(r, ms * (window.SPEED_MUL ?? 1)));
const isAI = s => G.players[s].type === 'ai';

/* ---------- the hands-on dice tray ---------- */
const Tray = {
  headless: false, el: null,
  quick() { return this.headless || Settings.quick; },
  rollN(n) { return Array.from({ length: n }, d6); },
  die(v, cls = '', i = -1) {
    const P = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] }[v] || [];
    return `<div class="die ${cls}" ${i >= 0 ? `data-i="${i}"` : ''}>${Array.from({ length: 9 }, (_, k) => `<span class="${P.includes(k) ? 'pip' : ''}"></span>`).join('')}</div>`;
  },
  open(html) {
    if (!this.el) { this.el = document.createElement('div'); this.el.id = 'tray'; document.body.appendChild(this.el); }
    this.el.innerHTML = `<div class="tray-in">${html}</div>`; this.el.classList.add('on');
  },
  close() { if (this.el) this.el.classList.remove('on'); },
  autoPolicy(o, d) { // rerolls the AI (or quick dice) takes on its own
    const fail = v => o.need ? v < o.need : false;
    if (o.kind === 'save' || o.kind === 'fnp') return d;
    if (o.rrFails) d = d.map(v => fail(v) ? d6() : v);
    else if (o.rrOnes) d = d.map(v => v === 1 ? d6() : v);
    if (o.oath && d.filter(fail).length > d.length / 2) { o.oath.oath = true; d = d.map(v => fail(v) ? d6() : v); }
    if (o.sum && o.rrAll && d.reduce((a, b) => a + b, 0) + (o.bonus || 0) < o.need) d = this.rollN(d.length);
    return d;
  },
  async step(o) {
    if (!o.n) return [];
    let d = this.rollN(o.n);
    if (this.quick() || isAI(o.side)) {
      d = this.autoPolicy(o, d);
      if (this.quick()) return d;
      await this.show(o, d, true);
      return d;
    }
    return this.interactive(o);
  },
  ok(o, v) { return o.plain ? true : o.kind === 'save' ? v >= o.need : v >= o.need; },
  sumLine(o, d) { const s = d.reduce((a, b) => a + b, 0) + (o.bonus || 0); return `<div class="tray-sum ${s >= o.need ? 'good' : 'bad'}">${s}${o.bonus ? ` (incl. +${o.bonus})` : ''} ${s >= o.need ? '✔' : '✘'} needs ${o.need}</div>`; },
  async show(o, d, auto) { // the AI rolling in front of you
    Sfx.play('dice');
    this.open(`<div class="tray-title">${o.title}</div><div class="tray-label">${G.players[o.side].name} rolls · ${o.label}</div><div class="dice rolling">${d.map(() => this.die(d6())).join('')}</div>`);
    await this.tumble(d);
    const html = d.map(v => this.die(v, o.sum || o.plain ? '' : this.ok(o, v) ? 'good' : 'bad')).join('');
    this.el.querySelector('.dice').classList.remove('rolling'); this.el.querySelector('.dice').innerHTML = html;
    if (o.sum) this.el.querySelector('.tray-in').insertAdjacentHTML('beforeend', this.sumLine(o, d));
    else if (!o.plain) this.el.querySelector('.tray-in').insertAdjacentHTML('beforeend', `<div class="tray-sum">${d.filter(v => this.ok(o, v)).length} of ${d.length} ${o.kind === 'save' ? 'saved' : o.kind === 'fnp' ? 'ignored' : 'succeed'}</div>`);
    await this.waitTap(Settings.fast ? 700 : 1500);
  },
  async tumble(d) { const box = this.el.querySelector('.dice'); for (let k = 0; k < 6; k++) { box.innerHTML = d.map(() => this.die(d6())).join(''); await sleep(55); } },
  waitTap(ms) { return new Promise(res => { let done = false; const go = () => { if (done) return; done = true; this.el.removeEventListener('click', go); res(); }; this.el.addEventListener('click', go); setTimeout(go, ms); }); },
  interactive(o) {
    return new Promise(res => {
      let d = Array(o.n).fill(0), rolled = false, swept = false, usedOnes = false, usedFails = false, picking = false, cmdUsed = G.cmdUsed[o.side];
      const fail = v => o.plain || o.sum ? false : !this.ok(o, v);
      const draw = () => {
        const btns = [];
        if (!rolled) btns.push(`<button class="b gold big" data-a="roll">🎲 Roll ${o.n} ${o.n === 1 ? 'die' : 'dice'}</button>`);
        else if (!swept) {
          if (o.rrOnes && !usedOnes && d.some(v => v === 1)) btns.push(`<button class="b" data-a="ones">↻ Re-roll 1s</button>`);
          if (o.rrFails && !usedFails && d.some(fail)) btns.push(`<button class="b" data-a="fails">↻ Re-roll fails</button>`);
          if (o.oath && !o.oath.oath && d.some(fail)) btns.push(`<button class="b" data-a="oath">⚜ Oath of Iron: re-roll fails</button>`);
          if (o.sum && o.rrAll && !usedFails) btns.push(`<button class="b" data-a="all">↻ Re-roll the charge</button>`);
          if (!cmdUsed && G.cp[o.side] >= 1) btns.push(`<button class="b ${picking ? 'gold' : ''}" data-a="cmd">${picking ? 'Tap a die to re-roll' : '✦ Command re-roll (1 CP)'}</button>`);
          if (o.sum || o.plain) btns.push(`<button class="b gold" data-a="done">Continue →</button>`);
          else btns.push(`<button class="b gold" data-a="sweep">${o.kind === 'save' ? '🧹 Clear saved dice' : o.kind === 'fnp' ? '🧹 Sweep away failed rolls' : '🧹 Sweep away misses'}</button>`);
        } else btns.push(`<button class="b gold big" data-a="done">Continue →</button>`);
        const shown = d.map((v, i) => [v, i]).filter(([v]) => !swept || (o.kind === 'save' ? !this.ok(o, v) : this.ok(o, v)));
        const n = shown.length;
        const after = swept ? `<div class="tray-sum ${n ? 'good' : 'bad'}">${o.kind === 'save' ? `${n} unsaved` : o.kind === 'fnp' ? `${n} ignored` : `${n} ${o.kind === 'hit' ? 'hit' : 'wound'}${n === 1 ? '' : 's'}`}</div>` : '';
        this.open(`<div class="tray-title">${o.title}</div><div class="tray-label">${G.players[o.side].name} · ${o.label}</div>
          <div class="dice ${picking ? 'picking' : ''}">${shown.map(([v, i]) => rolled ? this.die(v, o.sum || o.plain ? '' : fail(v) ? 'bad' : 'good', i) : this.die(0, 'blank', i)).join('')}</div>
          ${rolled && o.sum ? this.sumLine(o, d) : ''}${after}<div class="tray-btns">${btns.join('')}</div>`);
        this.el.querySelectorAll('[data-a]').forEach(b => b.onclick = e => { e.stopPropagation(); act(b.dataset.a); });
        if (picking) this.el.querySelectorAll('.die[data-i]').forEach(x => x.onclick = e => { e.stopPropagation(); const i = +x.dataset.i; d[i] = d6(); G.cp[o.side]--; G.cmdUsed[o.side] = true; cmdUsed = true; picking = false; Sfx.play('dice'); draw(); Battle.render(); });
      };
      const reroll = async (pred) => { const idx = d.map((v, i) => pred(v) ? i : -1).filter(i => i >= 0); Sfx.play('dice'); for (let k = 0; k < 5; k++) { idx.forEach(i => d[i] = d6()); draw(); await sleep(50); } idx.forEach(i => d[i] = d6()); draw(); };
      const act = async a => {
        if (a === 'roll') { rolled = true; Sfx.play('dice'); this.open(`<div class="tray-title">${o.title}</div><div class="dice rolling">${d.map(() => this.die(d6())).join('')}</div>`); await this.tumble(d); d = this.rollN(o.n); draw(); }
        else if (a === 'ones') { usedOnes = true; await reroll(v => v === 1); }
        else if (a === 'fails') { usedFails = true; await reroll(fail); }
        else if (a === 'oath') { o.oath.oath = true; await reroll(fail); }
        else if (a === 'all') { usedFails = true; await reroll(() => true); }
        else if (a === 'cmd') { picking = !picking; draw(); }
        else if (a === 'sweep') { swept = true; Sfx.play('sweep'); draw(); }
        else if (a === 'done') { res(d); }
      };
      draw();
    });
  },
  async note(title, text) { if (this.quick()) return; this.open(`<div class="tray-title">${title}</div><div class="tray-label">${text}</div>`); await this.waitTap(Settings.fast ? 600 : 1200); },
  async result(msg) { if (this.quick()) return; this.open(`<div class="tray-title">Result</div><div class="tray-label">${msg}</div>`); Sfx.play('hit'); await this.waitTap(Settings.fast ? 700 : 1400); this.close(); }
};

/* ---------- battlefield view and turn flow ---------- */
const Battle = {
  root: null, ui: { sel: null, mode: null, reach: null, targets: null }, endPhase: null, sid: 0,
  start(cfg) { newBattle(cfg); this.sid++; this.ui = {}; Tray.close(); this.render(); this.loop(this.sid); },
  resume(state) { G = migrate(state); NEXT_ID = Math.max(...G.units.flatMap(u => [u.uid, ...u.models.map(m => m.id)])) + 1; this.sid++; this.ui = {}; this.render(); this.loop(this.sid, true); },
  alive(my) { if (my !== this.sid) throw 'abort'; },
  async loop(my, resumed) {
    try {
      let skipStart = resumed;
      while (!G.over) {
        await this.playerTurn(G.turn, my, skipStart); skipStart = false; this.alive(my);
        if (G.over) break;
        const vp = scoreTurn(G.turn); if (vp) { log(`${pverb(G.turn, 'scores', 'score')} ${vp} VP from objectives.`); toast(`${pverb(G.turn, 'scores', 'score')} ${vp} VP`); }
        if (G.turn !== G.first) { if (G.round >= 5) { G.over = { winner: G.vp[0] > G.vp[1] ? 0 : G.vp[1] > G.vp[0] ? 1 : -1, why: 'vp' }; break; } G.round++; }
        G.turn = enemyOf(G.turn); this.render();
      }
      this.finish();
    } catch (e) { if (e !== 'abort') console.error(e); }
  },
  async playerTurn(s, my, resumed) {
    if (!resumed) {
      for (const u of unitsOf(s)) Object.assign(u, { moved: false, advanced: false, fellBack: false, shot: false, charged: false, chargedNow: false, fought: false, mvDone: false });
      for (const u of unitsOf(enemyOf(s))) Object.assign(u, { chargedNow: false, fought: false });
      G.phase = 'command'; G.cp[0]++; G.cp[1]++; G.cmdUsed = [false, false];
      this.banner(`Round ${G.round} · ${pname(s)}`, 'Command phase'); this.render(); await sleep(Settings.fast ? 300 : 700); this.alive(my);
      for (const u of unitsOf(s)) {
        u.shaken = false;
        const D = UD(u), Ld = unitLd(u), below = u.startN > 1 ? u.models.length * 2 < u.startN : u.models[0].w * 2 <= MW(u.models[0]);
        if (!below) continue;
        const d = await Tray.step({ kind: 'test', sum: true, title: `${D.n}: battle-shock test`, label: `Below half strength. Roll 2D6, needs ${Ld}+`, n: 2, need: Ld, side: s }); this.alive(my);
        const t = d[0] + d[1]; if (t < Ld) { u.shaken = true; log(`${D.n} is shaken (rolled ${t}).`); } else log(`${D.n} holds firm (rolled ${t}).`);
      }
      Tray.close();
    }
    if (isAI(s)) {
      await this.aiTurn(s, my);
    } else {
      if (!resumed || G.phase === 'command') G.phase = 'move';
      const order = ['move', 'shoot', 'charge'];
      for (let k = order.indexOf(G.phase); k < 3 && !G.over; k++) {
        G.phase = order[k]; this.ui = {}; this.banner(`${pname(s)}`, { move: 'Movement phase', shoot: 'Shooting phase', charge: 'Charge phase' }[G.phase]);
        Shell.save(); this.render();
        await new Promise(r => this.endPhase = r); this.alive(my);
      }
    }
    if (!G.over) await this.fightPhase(s, my);
  },
  async aiTurn(s, my) {
    const pause = async ms => { this.render(); await sleep(Settings.fast ? ms * .4 : ms); this.alive(my); };
    G.phase = 'move'; this.banner(pname(s), 'Movement phase'); await pause(500);
    for (const u of unitsOf(s)) {
      if (engaged(u)) { if (!AI.isMelee(u) && expected(engagedWith(u)[0], u, true) > expected(u, engagedWith(u)[0], true)) { const b = AI.bestMove(u, 0); if (b) { moveUnit(u, b.c, b.r); u.fellBack = true; u.moved = true; log(`${UD(u).n} falls back.`); await pause(500); } } continue; }
      let adv = 0;
      if (AI.isMelee(u)) { const near = Math.min(...unitsOf(enemyOf(s)).map(v => unitDistIn(u, v))); if (near > unitM(u) + 9) { adv = d6(); u.advanced = true; } }
      const b = AI.bestMove(u, adv);
      if (b && (b.c !== u.models[0].x || b.r !== u.models[0].y)) { moveUnit(u, b.c, b.r); u.moved = true; if (adv) log(`${UD(u).n} advances ${adv}".`); this.ui.flash = u.uid; await pause(450); }
    }
    this.ui.flash = null;
    G.phase = 'shoot'; this.banner(pname(s), 'Shooting phase'); await pause(500);
    for (const u of unitsOf(s)) { if (!canShoot(u)) continue; const v = AI.pickShot(u); if (!v) continue; this.ui = { sel: u.uid, aim: v.uid }; this.render(); Sfx.play('shot'); await resolveAttack(u, v, false); u.shot = true; this.alive(my); Tray.close(); await pause(300); if (G.over) return; }
    G.phase = 'charge'; this.ui = {}; this.banner(pname(s), 'Charge phase'); await pause(500);
    for (const u of unitsOf(s)) { if (!canCharge(u)) continue; const v = AI.pickCharge(u); if (!v) continue; this.ui = { sel: u.uid, aim: v.uid }; await this.doCharge(u, v, my); await pause(400); }
    this.ui = {};
  },
  async doCharge(u, v, my) {
    const need = chargeNeed(u, v), bonus = chargeBonus(u);
    const d = await Tray.step({ kind: 'charge', sum: true, title: `${UD(u).n} charges ${UD(v).n}!`, label: `Roll 2D6${bonus ? ' +' + bonus : ''}, needs ${need}" to reach`, n: 2, need, bonus, side: u.side, rrAll: hasRule(u, 'rerollCharge') || leadIs(u, 'chargeRR') });
    this.alive(my); Tray.close();
    u.charged = true;
    const roll = d[0] + d[1] + bonus;
    if (roll >= need && chargeMove(u, v, roll)) { u.chargedNow = true; u.moved = true; log(`${UD(u).n} charges into ${UD(v).n} (rolled ${roll}).`); Sfx.play('charge'); toast(`${UD(u).n} charges home!`); }
    else { log(`${UD(u).n} fails the charge (rolled ${roll}, needed ${need}).`); toast('Charge failed'); }
    this.render();
  },
  async fightPhase(s, my) {
    G.phase = 'fight'; this.ui = {};
    const queue = () => liveUnits().filter(u => !u.fought && engaged(u));
    if (!queue().length) return;
    this.banner(pname(s), 'Fight phase'); this.render(); await sleep(Settings.fast ? 300 : 700); this.alive(my);
    let side = s, guard = 0;
    while (queue().length && guard++ < 40 && !G.over) {
      const q = queue(), chargers = q.filter(u => u.chargedNow && u.side === s);
      let u = chargers[0] || q.find(x => x.side === side) || q[0];
      let v;
      if (!isAI(u.side) && engagedWith(u).length > 1) v = await this.pickTarget(u, engagedWith(u), `${UD(u).n} fights: tap the enemy to attack`);
      else v = AI.pickFight(u) || engagedWith(u)[0];
      this.alive(my);
      if (v) { this.ui = { sel: u.uid, aim: v.uid }; this.render(); Sfx.play('clash'); await resolveAttack(u, v, true); this.alive(my); Tray.close(); }
      u.fought = true; side = enemyOf(u.side); this.render();
    }
    this.ui = {};
  },
  pickTarget(u, list, msg) {
    return new Promise(res => { this.ui = { sel: u.uid, mode: 'pick', targets: new Set(list.map(v => v.uid)), pickRes: res, msg }; this.render(); });
  },
  finish() {
    Tray.close(); this.render(); Shell.clearSave();
    const o = G.over, w = o.winner, human = G.players.findIndex(p => p.type === 'human');
    const title = w === -1 ? 'A bloody stalemate' : G.players.every(p => p.type === 'human') ? `${pname(w)} is victorious!` : w === human ? 'Victory!' : 'Defeat';
    Sfx.play(w === human || (w >= 0 && G.players[w].type === 'human') ? 'win' : 'lose');
    Shell.endScreen(title, `${o.why === 'wipe' ? 'An army was wiped out.' : 'Five battle rounds are over.'}<br>${pname(0)} ${G.vp[0]} VP · ${pname(1)} ${G.vp[1]} VP`);

  },
  settings(inBattle) {
    const slider = (k, l) => `<label class="set"><span>${l}</span><input type="range" min="0" max="100" value="${Settings[k]}" oninput="Settings.${k}=+this.value;saveSettings()"></label>`;
    const toggle = (k, l, on, off) => `<label class="set"><span>${l}</span><select onchange="Settings.${k}=this.value==='1';saveSettings()"><option value="0" ${!Settings[k] ? 'selected' : ''}>${off}</option><option value="1" ${Settings[k] ? 'selected' : ''}>${on}</option></select></label>`;
    sheet(`<h2>Settings</h2>${slider('music', 'Music')}${slider('sfx', 'Sound effects')}
      ${toggle('quick', 'Dice', 'Quick (rolled for you)', 'Hands-on (roll them yourself)')}
      ${toggle('fast', 'Game speed', 'Fast', 'Normal')}
      <label class="set"><span>AI general</span><select onchange="Settings.diff=this.value;saveSettings()">${['easy', 'normal', 'hard'].map(d => `<option value="${d}" ${Settings.diff === d ? 'selected' : ''}>${d[0].toUpperCase() + d.slice(1)}</option>`).join('')}</select></label>
      <p class="small">The AI setting applies from the next battle.</p>
      <button class="b danger" onclick="Shell.reset()">Reset save data</button>`);
  },
  async reset() { const v = await choose('Reset save data?', 'This deletes your battle in progress and your settings.', [{ l: 'Delete', v: 1 }, { l: 'Keep', v: 0, p: 1 }]); if (v) { Store.del('save'); Store.del('settings'); location.reload(); } },
  more() {
    sheet(`<h2>More</h2><div class="grid2">
      <button class="tile" onclick="Shell.howto()"><span>?</span>How to play</button>
      <button class="tile" onclick="Shell.news()"><span>✦</span>What's new</button>
      <button class="tile" onclick="Shell.credits()"><span>★</span>Credits</button>
      <button class="tile" onclick="Shell.review()"><span>✎</span>Review</button>
      <button class="tile" onclick="Shell.support()"><span>♥</span>Support</button>
      <button class="tile" data-get-latest><span>⟳</span>Get latest version</button></div>`);
  },
  howto() {
    sheet(`<h2>How to play</h2><div class="prose">
      <p><b>Goal:</b> score the most victory points (VP) over five battle rounds by holding the five numbered objectives, or wipe out the enemy army.</p>
      <p><b>Your turn</b> has five phases:</p>
      <ol><li><b>Command:</b> both sides gain 1 command point (CP). Your units below half strength take a battle-shock test (2D6, needing their Leadership). Failed units are <i>shaken</i> and can't hold objectives.</li>
      <li><b>Movement:</b> tap a unit, then Move (its M in inches; each square is 2"), Advance (extra D6", but no charging and only assault weapons can fire) or Hold. Units in combat can Fall Back.</li>
      <li><b>Shooting:</b> tap a unit, tap Shoot, then tap a glowing enemy in range and sight. Ruins block sight. Cover gives +1 to saves.</li>
      <li><b>Charge:</b> a unit within 12" of an enemy can charge: roll 2D6 and reach them to get stuck in. Chargers strike first.</li>
      <li><b>Fight:</b> every unit in combat fights, chargers first.</li></ol>
      <p><b>The dice:</b> roll to hit (the weapon's skill or better), sweep away the misses, roll to wound (Strength against Toughness), then the defender rolls saves (worsened by AP). Each unsaved wound deals the weapon's Damage. Re-rolls show up as buttons: tap them, or spend 1 CP on a command re-roll and tap the die you want again.</p>
      <p><b>Objectives:</b> a marker belongs to the side with the most Objective Control (OC) within 3". From round 2, at the end of your turn you score 5 VP for holding one, 5 more for holding two or more, and 5 more for holding more than the enemy.</p>
      <p><b>Muster:</b> build your own armies from the main menu. Spend points on units, pick squad sizes and swap wargear for free. Every list needs a Leader.</p>
      <p><b>Leaders</b> can join a squad (gold-ringed on the field). The squad keeps its own stats, the leader takes wounds last, and the squad gets the leader's bonus. If the squad dies, the leader fights on alone.</p>
      <p><b>Sub-factions:</b> each army picks one, and its rule covers the whole army. Tap any unit to see your army's rule on its card.</p>
      <p><b>Tap any model</b> to see its unit's datasheet. Prefer the dice rolled for you? Choose Quick dice in Settings.</p></div>`);
  },
  news() { sheet(`<h2>What's new</h2>${CHANGES.map(([v, d, t, items]) => `<h3>${v} · ${t} <small>${d}</small></h3><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>`).join('')}`); },
  credits() {
    sheet(`<h2>Credits</h2><div class="prose center"><img src="icons/icon-192.png" width="72" alt=""><p><b>Iron Dominion</b><br>A Kralnu Games title</p>
      <p>Ideas, design and testing by Kris. Built with Claude, an AI by Anthropic.</p>
      <p>All armies, units, rules text and artwork are original. Iron Dominion is an independent game inspired by tabletop wargaming and is not affiliated with any wargame company.</p>
      <p>Sounds and music are synthesised in the game. No third-party assets.</p>
      <p><a href="https://kralnugames.com" target="_blank" rel="noopener">kralnugames.com</a> · hello@kralnugames.com</p></div>`);
  },
  review() {
    sheet(`<h2>Review</h2><div class="prose"><p>How's the war going? Tell Kris what you think.</p>
      <label class="set"><span>Rating</span><select id="rv-r">${[5, 4, 3, 2, 1].map(n => `<option>${n}</option>`).join('')}</select></label>
      <textarea id="rv-l" placeholder="What did you like?"></textarea><textarea id="rv-c" placeholder="What would you change?"></textarea><input id="rv-n" placeholder="Your name (optional)">
      <button class="b gold" onclick="Shell.sendReview()">Send review</button>
      <p class="small">Or email hello@kralnugames.com</p></div>`);
  },
  sendReview() {
    const q = new URLSearchParams(); const g = id => (document.getElementById(id) || {}).value || '';
    q.set(FORM_FIELDS.rating, g('rv-r')); q.set(FORM_FIELDS.liked, g('rv-l')); q.set(FORM_FIELDS.change, g('rv-c')); q.set(FORM_FIELDS.name, g('rv-n')); q.set(FORM_FIELDS.version, 'Iron Dominion ' + GAME_VERSION);
    fetch(`https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`, { method: 'POST', mode: 'no-cors', body: q }).catch(() => {});
    closeSheet(); toast('Thanks! Your review is on its way.');
  },
  support() { sheet(`<h2>Support</h2><div class="prose center"><p>Enjoying Iron Dominion? You can support Kralnu Games on Ko-fi. It's always free to play, with no ads.</p><a class="b gold" href="https://ko-fi.com/kralnu90" target="_blank" rel="noopener">♥ Ko-fi</a></div>`); }
};

/* ---------- little dialog helpers ---------- */
function choose(title, html, btns) {
  return new Promise(res => {
    const ov = document.createElement('div'); ov.className = 'ov';
    ov.innerHTML = `<div class="dlg"><h2>${title}</h2>${html ? `<div class="dlg-b">${html}</div>` : ''}<div class="dlg-btns">${btns.map((b, i) => `<button class="b ${b.p ? 'gold' : ''}" data-i="${i}">${b.l}</button>`).join('')}</div></div>`;
    ov.onclick = e => { const i = e.target.closest('[data-i]'); if (i) { ov.remove(); res(btns[+i.dataset.i].v); } };
    document.body.appendChild(ov);
  });
}
function sheet(html) { closeSheet(); const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'sheet'; ov.innerHTML = `<div class="dlg wide">${html}<div class="dlg-btns"><button class="b gold" onclick="closeSheet()">Back</button></div></div>`; ov.onclick = e => { if (e.target === ov) closeSheet(); }; document.body.appendChild(ov); }
function closeSheet() { document.getElementById('sheet')?.remove(); if (G && Battle.root) Battle.render(); }

/* ---------- start ---------- */
window.kgBeforeUpdate = () => Shell.save();
addEventListener('pagehide', () => Shell.save());
document.addEventListener('visibilitychange', () => { if (document.hidden) Shell.save(); });
document.addEventListener('pointerdown', () => Sfx.unlock(), { once: true });
addEventListener('resize', () => { if (G && Battle.root) Battle.render(); });
setTimeout(() => { document.getElementById('splash')?.classList.add('gone'); Shell.menu(); }, 1400);

</script>

<script id="kg-install">
(function(){
  var NAME='Iron Dominion',KEY='idom-install-snooze',AUTO=0;
  var evt=null,sheet=null,root=document.documentElement;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  function standalone(){return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true}
  function can(){return !standalone()&&(!!evt||ios)}
  function sync(){root.classList.toggle('kg-can-install',can())}
  function snoozed(){try{return Date.now()<(+localStorage.getItem(KEY)||0)}catch(e){return false}}
  function snooze(days){try{localStorage.setItem(KEY,String(Date.now()+days*864e5))}catch(e){}}
  function close(){if(sheet){sheet.remove();sheet=null}}
  function show(auto){close();var iosHelp=!evt&&ios;sheet=document.createElement('div');sheet.className='kg-sheet';sheet.setAttribute('role','dialog');sheet.setAttribute('aria-label','Install '+NAME);
    sheet.innerHTML='<b>Install '+NAME+'?</b><p>'+(iosHelp?'In Safari, tap the <b>Share</b> button, then <b>Add to Home Screen</b>. It then opens full screen and works offline.':'Put it on your home screen and play full screen like a proper app, even without a signal.')+'</p><div class="kg-row"><button type="button" class="kg-no">'+(iosHelp?'Got it':'Not now')+'</button>'+(iosHelp?'':'<button type="button" class="kg-yes">Install</button>')+'</div>';
    document.body.appendChild(sheet);
    sheet.querySelector('.kg-no').onclick=function(){snooze(auto?3:1);close()};
    var y=sheet.querySelector('.kg-yes');if(y){y.onclick=install;y.focus()}}
  function install(){close();var e=evt;evt=null;if(!e){sync();return}e.prompt();Promise.resolve(e.userChoice).then(sync,sync)}
  addEventListener('beforeinstallprompt',function(e){e.preventDefault();evt=e;sync();if(AUTO&&!snoozed())setTimeout(function(){if(evt&&!sheet&&!standalone())show(true)},AUTO)});
  addEventListener('appinstalled',function(){evt=null;sync();close()});
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest&&e.target.closest('[data-install]');if(!b)return;e.preventDefault();e.stopPropagation();if(evt)install();else if(ios)show(false)},true);
  sync();
  window.KralnuInstall={can:can,open:function(){show(false)}};
  if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>

@media (prefers-reduced-motion:reduce){.kg-upd{transition:none}}

<script id="kg-update">
// Kralnu Games update check. When you push an update, change the game's version
// AND version.json to the same new value; players then get a "new version" notice.
(function(){
  var NAME="Iron Dominion",BUILD="0.2.0",CACHES=["idom-"],CHECK=true;
  var path=location.pathname,dir=path.replace(/[^/]*$/,''),last=0,bar=null,busy=false;
  if(/^\?v=\d+$/.test(location.search)){try{history.replaceState(history.state,'',path+location.hash)}catch(e){}}
  function build(){return String(window.kgBuild!=null?window.kgBuild:BUILD)}
  function skipped(v){try{return sessionStorage.getItem('kg-upd-skip')===v}catch(e){return false}}
  function hide(){if(!bar)return;var b=bar;bar=null;b.classList.remove('on');setTimeout(function(){b.remove()},400)}
  function note(html,buttons){hide();bar=document.createElement('div');bar.className='kg-upd';bar.setAttribute('role','status');
    bar.innerHTML='<span>'+html+'</span>'+buttons;document.body.appendChild(bar);
    var b=bar;requestAnimationFrame(function(){requestAnimationFrame(function(){b.classList.add('on')})});return b}
  function latest(){return fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()})}
  function now(){if(busy)return;busy=true;
    // Only clear the offline copy once we know the newest version can be downloaded.
    latest().then(function(){
      try{window.kgBeforeUpdate&&window.kgBeforeUpdate()}catch(e){}
      var jobs=[];
      try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.filter(function(r){return r.scope.indexOf(location.origin+dir)===0}).map(function(r){return r.unregister()}))}))}catch(e){}
      try{if(window.caches)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return CACHES.some(function(p){return k.indexOf(p)===0})}).map(function(k){return caches.delete(k)}))}))}catch(e){}
      var done=false,go=function(){if(done)return;done=true;location.replace(path+'?v='+Date.now())};
      Promise.all(jobs).then(go,go);setTimeout(go,3000);
    },function(){busy=false;
      var b=note('No connection right now. Get online, then try again.','<button type="button" class="kg-later">OK</button>');
      b.querySelector('.kg-later').onclick=hide;setTimeout(function(){if(bar===b)hide()},6000);
    });
  }
  function show(v){if(bar||skipped(v))return;
    var b=note('A new version of '+NAME+' is ready.','<button type="button" class="kg-later">Later</button><button type="button" class="kg-go">Update</button>');
    b.querySelector('.kg-go').onclick=now;
    b.querySelector('.kg-later').onclick=function(){try{sessionStorage.setItem('kg-upd-skip',v)}catch(e){}hide()};
  }
  function check(force){if(!CHECK)return;var t=Date.now();if(!force&&t-last<6e5)return;last=t;
    latest().then(function(j){if(j&&j.version!=null&&String(j.version)!==build())show(String(j.version))}).catch(function(){})}
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest&&e.target.closest('[data-get-latest]');if(!b)return;e.preventDefault();e.stopPropagation();now()},true);
  addEventListener('load',function(){setTimeout(function(){check(true)},4000)});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)check(false)});
  setInterval(function(){if(!document.hidden)check(false)},18e5);
  window.KralnuUpdate={now:now,check:function(){check(true)},build:build};
})();
</script>
